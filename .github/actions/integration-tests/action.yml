name: "Integration tests"
description: "Run tests with BTP services being bound"
inputs:
  CF_API:
    description: "Cloud Foundry API endpoint"
    required: true
  CF_USERNAME:
    description: "Cloud Foundry username"
    required: true
  CF_PASSWORD:
    description: "Cloud Foundry password"
    required: true
  CF_ORG:
    description: "Cloud Foundry organization"
    required: true
  CF_SPACE:
    description: "Cloud Foundry space"
    required: true
  NODE_VERSION:
    description: "Node.js version to use for tests"
    required: true
  CDS_VERSION:
    description: "CDS version to install globally (e.g. 9, latest)"
    required: true
runs:
  using: "composite"
  steps:
    - name: Install dependencies and Cloud Foundry CLI (v8.9.0)
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libc6 wget tar
        wget "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=8.9.0&source=github-rel" -O cf-cli.tar.gz
        tar -xvzf cf-cli.tar.gz
        sudo mv cf /usr/local/bin/
        sudo mv cf8 /usr/local/bin/
        cf --version

    - name: Authenticate with Cloud Foundry
      shell: bash
      env:
        CF_API: ${{ inputs.CF_API }}
        CF_USERNAME: ${{ inputs.CF_USERNAME }}
        CF_PASSWORD: ${{ inputs.CF_PASSWORD }}
        CF_ORG: ${{ inputs.CF_ORG }}
        CF_SPACE: ${{ inputs.CF_SPACE }}
      run: |
        for i in {1..5}; do
          cf api "$CF_API" && \
          cf auth && \
          cf target -o "$CF_ORG" -s "$CF_SPACE" && break
          echo "cf login failed, retrying ($i/5)..."
          sleep 10
          if [ "$i" -eq 5 ]; then
            echo "❌ cf login failed after 5 attempts."
            exit 1
          fi
        done

    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Use Node.js ${{ inputs.NODE_VERSION }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: ${{ inputs.NODE_VERSION }}

    - name: Install global CDS
      shell: bash
      run: npm i -g @sap/cds-dk@${{ inputs.CDS_VERSION }}

    - name: Pin CDS 9 compatible stack
      if: inputs.CDS_VERSION == '9'
      shell: bash
      run: |
        npm pkg set "devDependencies.@cap-js/sqlite=^2"
        npm pkg set "overrides.@cap-js/hana=^2"
        npm pkg set "overrides.@sap/cds-mtxs=^3"
        npm pkg set "devDependencies.@sap/cds=^9"
        npm pkg set --workspace=tests/bookshop "dependencies.@sap/cds=^9"

    - name: Install all dependencies
      shell: bash
      run: npm install

    - name: Derive HANA test identifiers
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.NODE_VERSION }}
        CDS_VERSION: ${{ inputs.CDS_VERSION }}
      run: |
        node_version_hana=$(printf '%s' "$NODE_VERSION" | tr '.' '_')
        cds_version_hana=$(printf '%s' "$CDS_VERSION" | tr '.' '_')
        test_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${node_version_hana}-${cds_version_hana}"
        hdi_service_name="cap-js-ai-hana-${GITHUB_RUN_ID}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${node_version_hana}-${cds_version_hana}"
        {
          printf 'NODE_VERSION_HANA=%s\n' "$node_version_hana"
          printf 'CDS_VERSION_HANA=%s\n' "$cds_version_hana"
          printf 'CAP_AI_TEST_ID=%s\n' "$test_id"
          printf 'CAP_AI_HDI_SERVICE_NAME=%s\n' "$hdi_service_name"
        } >> "$GITHUB_ENV"
    - name: CDS Versions being used
      run: cds v -i
      shell: bash

    # Deploy model to HANA
    - name: Create HDI container
      shell: bash
      run: cf create-service hana hdi-shared "$CAP_AI_HDI_SERVICE_NAME"
    - name: Deploy bookshop model to HDI
      run: cd tests/bookshop/ && cds deploy --to hana:"$CAP_AI_HDI_SERVICE_NAME"
      shell: bash

    # Bind against BTP services
    - name: Bind HDI container
      run: cds bind db -2 "$CAP_AI_HDI_SERVICE_NAME" -o package.json
      shell: bash
    - name: Bind AI Core
      run: cds bind ai-core -2 cap-js-ai-core -o package.json
      shell: bash

    # Run tests in hybrid mode
    - name: Run hybrid integration tests
      run: npm run test:hybrid
      shell: bash

    - name: Report failed HDI service state
      if: ${{ failure() }}
      shell: bash
      run: cf service "$CAP_AI_HDI_SERVICE_NAME" || true

    # Cleanup AI Core test resource groups
    - name: Cleanup AI Core test resource groups
      if: ${{ always() }}
      shell: bash
      run: cds bind --exec -- node tests/integration/cleanup-resource-groups.cjs || true

    # Cleanup BTP services
    - name: Delete HDI Container Key
      if: ${{ always() }}
      run: cf delete-service-key "$CAP_AI_HDI_SERVICE_NAME" "$CAP_AI_HDI_SERVICE_NAME-key" -f
      shell: bash

    # Note: The initial delete attempt often fails due to an "ongoing operation on service binding" error.
    - name: Delete HDI Container
      if: ${{ always() }}
      shell: bash
      run: |
        for i in {1..3}; do
          cf delete-service "$CAP_AI_HDI_SERVICE_NAME" -f && break
          echo "HDI container delete failed, retrying ($i/3)..."
          sleep 10
          if [ "$i" -eq 3 ]; then
            echo "❌ HDI container delete failed after 3 attempts."
            exit 1
          fi
        done
